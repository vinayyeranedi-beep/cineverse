<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cineverse Multiplex - In-Seat Cinema Dining</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Redirects any 404 route to index.html with query parameters preserved
      var pathSegmentsToKeep = 1; // for /cineverse/
      var l = window.location;
      var repoName = l.pathname.split('/')[1]; // 'cineverse'
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + repoName + '/?p=' + encodeURIComponent(l.pathname.slice(repoName.length + 2) + l.search + l.hash);
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100">
    <div style="padding: 40px; text-align: center; font-family: sans-serif;">
      <h2>Loading Cineverse Multiplex...</h2>
    </div>
  </body>
</html>
