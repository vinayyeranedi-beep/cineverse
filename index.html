    <script>
      // Normalizes subdirectory path for GitHub Pages without trailing slash so relative/base assets resolve properly
      (function() {
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          var target = window.location.protocol + '//' + window.location.host + path + '/' + window.location.search + window.location.hash;
          window.location.replace(target);
        }
      })();
    </script>
  </head>
  <body style="background-color: #0B0B0F; color: #f4f4f5; margin: 0; min-height: 100vh;" class="bg-[#0B0B0F] text-zinc-100 antialiased selection:bg-[#D4AF37] selection:text-black">
    <div id="root">
      <div style="min-height: 100vh; background-color: #0B0B0F; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Space Grotesk', system-ui, sans-serif; color: #D4AF37; text-align: center; padding: 20px;">
        <div style="width: 52px; height: 52px; border: 3px solid rgba(212,175,55,0.25); border-top-color: #D4AF37; border-radius: 50%; animation: cineverse-spin 0.8s linear infinite; margin-bottom: 20px;"></div>

        @keyframes cineverse-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
