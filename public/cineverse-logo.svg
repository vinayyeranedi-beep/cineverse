<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="100%" height="100%">
  <defs>
    <!-- Metallic Cinema Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A8" />
      <stop offset="25%" stop-color="#E5B942" />
      <stop offset="55%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#B8861B" />
      <stop offset="100%" stop-color="#7B570A" />
    </linearGradient>

    <!-- Projector Light Beam Gradient -->
    <linearGradient id="beamGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF5B8" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#D4AF37" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A24" />
      <stop offset="100%" stop-color="#0E0E14" />
    </linearGradient>

    <!-- Badge Border Gold -->
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#805B0D" />
    </linearGradient>

    <!-- Golden Soft Glow Filter -->
    <filter id="goldGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= LOGO ICON / EMBLEM ================= -->
  <g transform="translate(10, 10)">
    <!-- Container Badge -->
    <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#badgeDark)" stroke="url(#badgeBorder)" stroke-width="2.5" />
    
    <!-- Ambient Inner Glow Ring -->
    <rect x="3" y="3" width="114" height="114" rx="23" fill="none" stroke="url(#goldMetallic)" stroke-width="0.8" opacity="0.35" />

    <!-- Double Play Chevrons -->
    <!-- Chevron 1 (Behind) -->
    <polygon points="14,38 32,60 14,82 23,82 41,60 23,38" fill="url(#goldMetallic)" opacity="0.7" />
    <!-- Chevron 2 (Forward) -->
    <polygon points="27,38 45,60 27,82 36,82 54,60 36,38" fill="url(#goldMetallic)" />

    <!-- Film Projector Dual Reels -->
    <!-- Left Reel -->
    <g transform="translate(64, 34)">
      <circle cx="0" cy="0" r="14.5" fill="none" stroke="url(#goldMetallic)" stroke-width="3.5" />
      <circle cx="0" cy="0" r="4.5" fill="url(#goldMetallic)" />
      <!-- Spoke holes -->
      <circle cx="0" cy="-7.5" r="2.2" fill="url(#goldMetallic)" />
      <circle cx="-6.5" cy="4" r="2.2" fill="url(#goldMetallic)" />
      <circle cx="6.5" cy="4" r="2.2" fill="url(#goldMetallic)" />
    </g>

    <!-- Right Reel -->
    <g transform="translate(93, 34)">
      <circle cx="0" cy="0" r="14.5" fill="none" stroke="url(#goldMetallic)" stroke-width="3.5" />
      <circle cx="0" cy="0" r="4.5" fill="url(#goldMetallic)" />
      <!-- Spoke holes -->
      <circle cx="0" cy="-7.5" r="2.2" fill="url(#goldMetallic)" />
      <circle cx="-6.5" cy="4" r="2.2" fill="url(#goldMetallic)" />
      <circle cx="6.5" cy="4" r="2.2" fill="url(#goldMetallic)" />
    </g>

    <!-- Connecting Film Loop -->
    <path d="M64 20 Q78.5 25 93 20" fill="none" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Projector Body Chassis -->
    <rect x="52" y="49" width="46" height="30" rx="5" fill="url(#goldMetallic)" />
    
    <!-- Chassis details / vents & controls -->
    <line x1="58" y1="56" x2="72" y2="56" stroke="#15151C" stroke-width="2.2" stroke-linecap="round" />
    <line x1="58" y1="62" x2="72" y2="62" stroke="#15151C" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="85" cy="64" r="5" fill="#15151C" />
    <circle cx="85" cy="64" r="2.5" fill="url(#goldMetallic)" />

    <!-- Lens & Projection Shutter -->
    <polygon points="98,54 113,46 113,76 98,68" fill="url(#goldMetallic)" />

    <!-- Radiant Projection Beam -->
    <polygon points="113,48 126,41 126,81 113,74" fill="url(#beamGlow)" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- Wordmark: CINEVERSE -->
  <g transform="translate(150, 72)">
    <text font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="4">
      <tspan fill="#FFFFFF">CINE</tspan><tspan fill="url(#goldMetallic)">VERSE</tspan>
    </text>
  </g>

  <!-- Subtitle: MULTIPLEX -->
  <g transform="translate(154, 106)">
    <!-- Accent Left Line -->
    <line x1="0" y1="-6" x2="28" y2="-6" stroke="url(#goldMetallic)" stroke-width="1.8" opacity="0.65" />
    
    <!-- Subtitle Text -->
    <text x="38" y="0" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="9" fill="url(#goldMetallic)">
      MULTIPLEX
    </text>

    <!-- Accent Right Line -->
    <line x1="262" y1="-6" x2="290" y2="-6" stroke="url(#goldMetallic)" stroke-width="1.8" opacity="0.65" />
  </g>
</svg>
