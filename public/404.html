<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cineverse Multiplex</title>
    <script type="text/javascript">
      // GitHub Pages SPA router redirect
      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);
      var knownRoutes = ['order', 'counter', 'staff', 'admin'];
      var repo = '';
      var subRoute = '';

      if (pathSegments.length > 0 && !knownRoutes.includes(pathSegments[0].toLowerCase())) {
        repo = pathSegments[0];
        subRoute = pathSegments.slice(1).join('/');
      } else {
        subRoute = pathSegments.join('/');
      }

      var tab = '';
      if (subRoute.includes('counter') || subRoute.includes('staff')) tab = 'counter';
      else if (subRoute.includes('admin')) tab = 'admin';
      else if (subRoute.includes('order')) tab = 'order';

      var redirectUrl = l.protocol + '//' + l.host + (repo ? '/' + repo + '/' : '/');
      var params = new URLSearchParams(l.search);
      if (tab) params.set('tab', tab);
      if (params.toString()) {
        redirectUrl += '?' + params.toString();
      }
      if (l.hash) {
        redirectUrl += l.hash;
      }
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body style="background-color: #0B0B0F; color: #D4AF37; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; margin: 0;">
    <div style="text-align: center;">
      <h2 style="font-size: 20px; font-weight: bold; letter-spacing: 1px;">Loading Cineverse Multiplex...</h2>
    </div>
  </body>
</html>
